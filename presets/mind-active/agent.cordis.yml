# dsh-mind / mind-active preset — 全开模式
#
# 提供所有 agent 层能力：
#   - 记忆审查提醒（memory-nudge）
#   - 记忆使用指导（memory-guidance）
#   - 技能管理工具（skill-manage）
#
# 前提：profile 已安装 @wumihaze/dsh-mind bundle（提供 host 层服务）。
# 安装：将本目录复制到 ~/.dsh/.agent-presets/mind-active/

# ── Memory ────────────────────────────────────────────────────────────────

# 每 N 轮对话后提醒 agent 审查记忆库，保持记忆精炼。
- id: memory-nudge
  name: '@wumihaze/dsh-mind/memory/nudge'
  config:
    intervalTurns: 8

# 系统提示：教导 agent 如何正确使用记忆系统。
- id: memory-guidance
  name: '@wumihaze/dsh-mind/memory/guidance'

# ── Memory ───────────────────────────────────────────────────────────────

# 提供 memory 工具：list / search / add / replace / remove。
# agent 用它读改写 ~/.dsh/memory/MEMORY.md（GUI 面板和 CLI 同一份）。
- id: tool-memory
  name: '@wumihaze/dsh-mind/tool/memory'

# ── Skill lifecycle ──────────────────────────────────────────────────────

# 提供 skill_manage 工具：archive / restore / list / status / prune。
# 配合 host 层的 curator-core 服务使用。
- id: tool-skill-manage
  name: '@wumihaze/dsh-mind/tool/skill-manage'
