# dsh-mind / mind-light preset — 轻量模式
#
# 只提供记忆相关能力：
#   - 记忆审查提醒（memory-nudge）
#   - 记忆使用指导（memory-guidance）
#
# 不含技能管理工具，适合只需要记忆功能、不需要自动治理的轻量场景。
# 安装：将本目录复制到 ~/.dsh/.agent-presets/mind-light/

# ── Memory ────────────────────────────────────────────────────────────────

# 每 N 轮对话后提醒 agent 审查记忆库，保持记忆精炼。
- id: memory-nudge
  name: '@wumihaze/dsh-mind/memory/nudge'
  config:
    intervalTurns: 10

# 系统提示：教导 agent 如何正确使用记忆系统。
- id: memory-guidance
  name: '@wumihaze/dsh-mind/memory/guidance'

# 提供 memory 工具：list / search / add / replace / remove。
- id: tool-memory
  name: '@wumihaze/dsh-mind/tool/memory'
