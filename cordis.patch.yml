# dsh-mind bundle patch — HOST-PLANE services only.
# Applied after dsh-base and before the user's profile patch.
#
# Agent-plane plugins (memory-nudge, memory-guidance, tool-skill-manage)
# are provided by the shipped presets (presets/mind-active/ and presets/mind-light/).
#
# All plugin names reference sub-exports of @wumihaze/dsh-mind,
# resolved via the package's `exports` field.

- insert:
    # ── Skill usage tracking (host service) ───────────────────────────

    - id: skill-usage
      name: '@wumihaze/dsh-mind/skill-usage'

    # ── Curator core (host service) ───────────────────────────────────

    - id: curator-core
      name: '@wumihaze/dsh-mind/curator'
      config:
        staleAfterDays: 30
        archiveAfterDays: 90
        intervalDays: 7
        minIdleMinutes: 120

    # ── Web GUI HTTP routes (function plugin) ──────────────────────────

    - id: dsh-mind-web
      name: '@wumihaze/dsh-mind/web'
