# dsh-mind bundle patch — HOST-PLANE rows.
# Applied after dsh-base and before the user's profile patch.
#
# Everything here is host-plane so the capabilities are enabled for EVERY agent
# by default — no preset step needed. Agent-plane rows (memory-nudge, guidance,
# the memory tool, skill_manage) register their tools/prompt/agent listeners at
# the host scope, which is visible to all sessions.
#
# All plugin names reference sub-exports of @wumihaze/dsh-mind,
# resolved via the package's `exports` field.

- insert:
    # ── Client-registration anchor ────────────────────────────────────
    # A loader entry named exactly the bare package name is what registers the
    # Web client bundle: `dsh-client-modules` resolves <entry>/package.json,
    # reads `dsh.client`, and the built client bundle registers itself under
    # that same bare package name — the ids must match exactly. The package main
    # is a no-op plugin; the services below are the real work.
    - id: dsh-mind
      name: '@wumihaze/dsh-mind'

    # ── Skill usage tracking (host service) ───────────────────────────

    - id: skill-usage
      name: '@wumihaze/dsh-mind/skill-usage'

    # ── Curator core (host service) ───────────────────────────────────

    - id: curator-core
      name: '@wumihaze/dsh-mind/curator'
      config:
        staleAfterDays: 30
        archiveAfterDays: 90
        intervalDays: 7
        minIdleMinutes: 120

    # ── Web GUI HTTP routes (function plugin) ──────────────────────────

    - id: dsh-mind-web
      name: '@wumihaze/dsh-mind/web'

    # ── Agent capabilities (host-plane, enabled for every agent) ──────
    # Previously these lived in the mind-active/mind-light presets and required
    # an extra install step. Now they are host rows so every agent gets them.

    - id: memory-nudge
      name: '@wumihaze/dsh-mind/memory/nudge'
      config:
        intervalTurns: 8

    - id: memory-guidance
      name: '@wumihaze/dsh-mind/memory/guidance'

    - id: memory-auto
      name: '@wumihaze/dsh-mind/memory/auto'
      config:
        intervalTurns: 10
        debounceMs: 90000

    - id: tool-memory
      name: '@wumihaze/dsh-mind/tool/memory'

    - id: tool-skill-manage
      name: '@wumihaze/dsh-mind/tool/skill-manage'
